server:
  port: 5560

spring:
  application:
    name: yeed-gateway
  main:
    banner-mode: off
    web-application-type: reactive          # 网关为 WebFlux 响应式，强制指定避免误判
  profiles:
    active: @spring.profiles.active@
  reactor:
    context-propagation: auto               # 启用 Reactor 上下文传播以自动传递 traceId

logging:
  level:
    root: INFO
    # 业务代码默认 INFO 记录关键业务流和异常, 如果生产需要看 DEBUG 日志, 请在 Nacos 中修改
    com.yeungzhy.yeed: INFO
    # 框架日志减少噪音
    com.alibaba.nacos.client: WARN
  file:
    path: ./log/${spring.application.name}
